[pytest]
# Python path settings - ensure tests can find the package
pythonpath = 
    .
    src

# Test discovery and collection settings
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# Exclude test stubs and WIP tests by default
# They will also be filtered by the collection hook in conftest.py
norecursedirs = *stub* *wip*

# Asyncio settings
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Verbose output for clearer test results
log_cli = true
log_cli_level = INFO

# Test execution settings
# Turn off log capturing to see print output
# Filter deprecation warnings
addopts = -vxs
filterwarnings =
    ignore::DeprecationWarning:pydantic._internal._config
    ignore::DeprecationWarning:jsonschema.validators

# Custom markers
markers =
    stub: marks tests as stubs that are not intended to run yet
    wip: marks tests as work in progress
    integration: marks tests that require integration with external systems
    slow: marks tests that take a long time to run
    db: marks tests that require a database connection
